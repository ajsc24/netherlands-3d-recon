# Faster rebuild: half the images, smaller resolution, GPU bundle adjustment.
# Use when willing to re-run from dewarp (not mid-mapper).
video_path: "input/NetherlandsBottomLevel.mp4"
reference_video_path: null
work_dir: "workspace_netherlands"

extract_fps: 1.5
max_frames: 240

projection: equirect
views_per_frame: 4
perspective_fov_deg: 90
perspective_size: 768

drone_mask:
  enabled: true
  polygon:
    - [0.0, 0.58]
    - [1.0, 0.58]
    - [1.0, 1.0]
    - [0.0, 1.0]
  dilate_px: 0
  inpaint: false

colmap:
  enabled: true
  colmap_exe: "tools/bin/colmap.exe"
  max_image_size: 1200
  use_gpu: true
  ba_use_gpu: true
  dense_mode: cuda
  dense_geom_consistency: false
  dense_max_image_size: 1000
  single_camera: false
  matcher: sequential
  sequential_overlap: 20
  init_min_num_inliers: 15
  abs_pose_min_num_inliers: 10
  min_num_matches: 8
  ba_global_max_num_iterations: 30
  use_masks_in_colmap: true
