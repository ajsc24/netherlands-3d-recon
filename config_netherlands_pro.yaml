# Pro-style reconstruction: ~45 sharp keyframes x 4 views (~180 images).
# Closer to what Polycam / RealityCapture do with ~30 photos.
video_path: "input/NetherlandsBottomLevel.mp4"
reference_video_path: null
work_dir: "workspace_netherlands_pro"

extract_fps: 2.0
max_frames: 320

keyframes:
  enabled: true
  target_count: 45
  min_frame_gap: 5
  sharpness_downscale: 8
  output_dir: "frames_key"
  use_for_pipeline: true

projection: equirect
views_per_frame: 4
perspective_fov_deg: 90
perspective_size: 1280

drone_mask:
  enabled: true
  polygon:
    - [0.0, 0.72]
    - [1.0, 0.72]
    - [1.0, 1.0]
    - [0.0, 1.0]
  dilate_px: 0
  inpaint: false

colmap:
  enabled: true
  colmap_exe: "tools/bin/colmap.exe"
  max_image_size: 2000
  use_gpu: true
  ba_use_gpu: true
  single_camera: true
  dense_mode: cuda
  dense_geom_consistency: true
  dense_max_image_size: 1600
  dense_gpu_index: 0
  dense_cache_size: 64
  fusion_num_threads: 20
  fusion_use_cache: true
  fusion_cache_size: 64
  fusion_max_reproj_error: 2.0
  fusion_max_depth_error: 0.01
  fusion_max_normal_error: 10
  fusion_min_num_pixels: 5
  fusion_check_num_images: 25
  matcher: sequential
  sequential_overlap: 30
  init_min_num_inliers: 20
  abs_pose_min_num_inliers: 12
  min_num_matches: 10
  use_masks_in_colmap: true

postprocess:
  enabled: true
  max_coord: 80.0
  core_percentile: 99.5
  outlier_k: 32
  outlier_threshold: 0.75
  normal_k: 20
  normal_smooth: 2
  poisson_depth: 11
  poisson_fulldepth: 6
  poisson_samples_per_node: 1.5
  poisson_point_weight: 4.0
  poisson_iters: 8
  poisson_preclean: true
  poisson_threads: 20
  min_component_percent: 2.0
  colmap_poisson_fallback: false
